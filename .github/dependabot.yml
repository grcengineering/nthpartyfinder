version: 2
updates:
  # GitHub Actions — keep every SHA-pinned action current (defends the
  # tj-actions CVE-2025-30066 retroactive-tag-rewrite class: Dependabot
  # bumps the pinned digest, the pin stays a 40-char SHA).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  # Cargo — the crate lives in /nthpartyfinder.
  - package-ecosystem: "cargo"
    directory: "/nthpartyfinder"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"

  # Docker — keep the SHA-pinned base images in the Dockerfiles current so the
  # digest pins (added for OpenSSF Scorecard Pinned-Dependencies) keep receiving
  # upstream security patches instead of freezing on a stale rolling tag.
  - package-ecosystem: "docker"
    directory: "/nthpartyfinder"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"

  # npm — the Svelte Flow vendor-graph frontend bundled into every HTML report. Its
  # package.json had no ecosystem entry here, so it never got a Dependabot PR: GitHub's baseline
  # dependency-graph scan still opened security ALERTS against it independently of this file
  # (that's how GHSA-r28c-9q8g-f849 in postcss, a transitive vite dep, was found) — but without
  # an entry here, a version-bump PR never followed, so the alert just sat open.
  #
  # Only the frontend gets an entry. The root Playwright-tooling package.json is deliberately
  # NOT tracked (.gitignore: "Rust project, not Node"), so a root npm entry has no manifest to
  # read — an entry for it fails every weekly cycle with dependency_file_not_found (observed
  # 4/4 cycles, 2026-08-07..08-28). Dependabot can only update manifests committed to the repo:
  # either track the root pair or carry no root entry.
  - package-ecosystem: "npm"
    directory: "/nthpartyfinder/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-frontend:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

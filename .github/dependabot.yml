version: 2
updates:
  # GitHub Actions — keep every SHA-pinned action current (defends the
  # tj-actions CVE-2025-30066 retroactive-tag-rewrite class: Dependabot
  # bumps the pinned digest, the pin stays a 40-char SHA).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  # Cargo — the crate lives in /nthpartyfinder.
  - package-ecosystem: "cargo"
    directory: "/nthpartyfinder"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"

  # Docker — keep the SHA-pinned base images in the Dockerfiles current so the
  # digest pins (added for OpenSSF Scorecard Pinned-Dependencies) keep receiving
  # upstream security patches instead of freezing on a stale rolling tag.
  - package-ecosystem: "docker"
    directory: "/nthpartyfinder"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"

  # npm — two real package.json/package-lock.json pairs existed with no ecosystem entry here, so
  # neither ever got a Dependabot PR: root (Playwright test tooling) and the Svelte Flow vendor-graph
  # frontend bundled into every HTML report. GitHub's baseline dependency-graph scan still opened
  # security ALERTS against them independently of this file (that's how GHSA-r28c-9q8g-f849 in
  # postcss, a transitive vite dep, was found) — but without an entry here, a version-bump PR never
  # followed, so the alert just sat open. This closes that gap for both directories.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-root:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "npm"
    directory: "/nthpartyfinder/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-frontend:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

# Catch a master commit whose always-on CI never even started, and re-fire it.
#
# Root cause (confirmed 2026-08-02, not theorized): GitHub's own anti-recursion policy —
# "events triggered by the GITHUB_TOKEN... will not create a new workflow run" — silently
# suppresses push-triggered workflows (CI, CodeQL, Docker Build, Security, OpenSSF Scorecard) on
# any master commit produced by an auto-merge completed under that token. Verified across six
# same-day merges: the four completed via `gh pr merge --auto` under GITHUB_TOKEN (mergedBy:
# app/github-actions) ALL produced zero push-triggered runs; the two merged directly by a human
# with a personal token both got the full set. dependabot-auto-merge.yml now prefers a MERGE_TOKEN
# secret specifically to avoid this at the source (see its header) — this workflow is the safety
# net for whatever still slips through: MERGE_TOKEN not yet configured, a future auto-merge path
# that reintroduces the same pattern, or a genuine one-off GitHub delivery gap unrelated to any of
# this (the original incident that started this investigation looked exactly like the latter
# before the token correlation was found, and there is no way to prove there is only one cause).
#
# Detection deliberately runs on a SCHEDULE, not push — the whole premise here is that push-based
# triggering can silently fail, so the detector cannot depend on push-based triggering itself.
#
# Deliberately does NOT try to read GitHub's own delivery/audit logs to diagnose a recurrence
# further: this org is on the Free plan and the audit-log API 404s here. The best available lever
# is the tracking issue below, appended to (never overwritten) on every detection, so a pattern
# across occurrences remains visible for as long as it takes to notice or to hand to GitHub
# Support with real, timestamped evidence — which is exactly how this specific cause was found.
name: CI Completeness Monitor

on:
  schedule:
    # Every 23 minutes: comfortably inside the 12-minute grace window used below without being
    # so frequent it burns Actions minutes for a check that is a no-op the overwhelming majority
    # of the time. An off-round number so this doesn't line up with every other repo's :00/:30 cron.
    - cron: "*/23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Verify every master commit got its always-on CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # to re-dispatch a missing workflow via workflow_dispatch
      issues: write  # to file/append the tracking issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check CI completeness
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          nthpartyfinder/scripts/check-ci-completeness.sh --json | tee report.json
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Re-fire missing workflows against master's current tip
        if: steps.check.outputs.exit_code != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # workflow_dispatch runs against a REF, not a historical commit's tree — dispatching
          # runs the workflow against whatever master's tip is right now, not the gapped commit
          # specifically. That is the correct behavior, not a compromise: the point is a fresh,
          # valid signal for current master content, which subsumes every gapped commit's
          # correctness as long as nothing has regressed since. This is also why remediation is
          # idempotent for free — once dispatched, the next run's check finds the workflow now
          # present for the tip and stops re-dispatching; nothing here tracks state across runs.
          declare -A WORKFLOW_FILES=(
            ["CI"]="build.yml"
            ["CodeQL"]="codeql.yml"
            ["Docker Build"]="docker.yml"
            ["Security"]="security.yml"
            ["OpenSSF Scorecard"]="scorecard.yml"
          )
          MISSING="$(jq -r '[.gaps[].missing_workflows[]] | unique[]' report.json)"
          REDISPATCHED=""
          while IFS= read -r wf; do
            [ -z "$wf" ] && continue
            file="${WORKFLOW_FILES[$wf]:-}"
            if [ -z "$file" ]; then
              echo "::warning::No known workflow file for '${wf}' — skipping re-dispatch, manual check needed"
              continue
            fi
            echo "::notice::Re-dispatching ${wf} (${file}) against master"
            if gh workflow run "$file" --ref master; then
              REDISPATCHED="${REDISPATCHED}${REDISPATCHED:+, }${wf}"
            else
              echo "::warning::Failed to re-dispatch ${wf} — needs a manual 'gh workflow run ${file} --ref master'"
            fi
          done <<< "$MISSING"
          echo "REDISPATCHED=${REDISPATCHED}" >> "$GITHUB_ENV"

      - name: Publish the report to the run summary
        shell: bash
        run: |
          {
            echo '## CI completeness check'
            echo
            echo '```json'
            cat report.json
            echo '```'
            if [ -n "${REDISPATCHED:-}" ]; then
              echo
              echo "Re-dispatched: ${REDISPATCHED}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Appends, never overwrites or replaces prior content — unlike distribution-sync.yml's
      # refresh-in-place tracker, this one is forensic: a single occurrence is nearly always
      # explained by MERGE_TOKEN not being configured yet, but a PATTERN across several
      # occurrences (timing, always-after-auto-merge, always a specific workflow) is the only
      # realistic path to noticing a genuinely new cause, and that requires the full history to
      # stay readable in one place rather than each detection erasing the last.
      - name: Record this occurrence on the standing issue
        if: steps.check.outputs.exit_code != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="CI completeness gaps (recurring log)"
          # The printf format string below is deliberately single-quoted so its %s placeholders
          # are left for printf to substitute, not expanded by the shell first.
          # shellcheck disable=SC2016
          BODY="$(printf '%s\n\n```json\n%s\n```\n\nRe-dispatched: %s\n\nRun: %s/%s/actions/runs/%s' \
            "Detected at $(date -u +%Y-%m-%dT%H:%M:%SZ). One occurrence is most likely dependabot-auto-merge.yml completing a merge without a MERGE_TOKEN secret configured (see that workflow's header) — check whether the commit(s) below were auto-merged before assuming anything new. Missing workflows were re-dispatched against master's current tip; see the run for whether that succeeded." \
            "$(cat report.json)" \
            "${REDISPATCHED:-none}" \
            "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"

          EXISTING="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number -q '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Appended to issue #${EXISTING}"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "dependencies" 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi

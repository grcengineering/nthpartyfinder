name: "CodeQL"

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  schedule:
    - cron: "27 3 * * 1"
  # For ci-completeness-monitor.yml to re-fire this workflow on demand when a push to master
  # never triggered it in the first place (see that workflow for why this can happen).
  workflow_dispatch: {}

# Least-privilege default for the workflow; each job widens to exactly what it needs.
permissions:
  contents: read

jobs:
  analyze-rust:
    name: Analyze (rust)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: rust
          build-mode: none  # only supported mode for Rust (CodeQL Rust GA, Oct-2025)
          # NOTE: codeql-config.yml carries NO query exclusions. The earlier
          # rust/path-injection findings were REMEDIATED IN CODE (commit b9d8609:
          # "remediate CodeQL rust/path-injection, rust/non-https-url,
          # actions/missing-workflow-permissions"), not suppressed. The config
          # file is retained for future query-suite scoping only. CodeQL Rust
          # does NOT cover OWASP A06 (vulnerable deps) — SCA stays on cargo-deny.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:rust"

  analyze-other:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: ruby
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
